<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WICK — adopt your candle</title>
  <meta name="description" content="Adopt your own little candle. Feed it and watch it grow: when $WICK goes up, every candle grows faster. Free, no wallet.">
  <meta property="og:title" content="WICK — adopt your candle">
  <meta property="og:description" content="A candle for everyone. Keep yours alive and watch it grow.">
  <meta property="og:image" content="/brand/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="/brand/og.png">
  <meta name="theme-color" content="#0a0705">
  <link rel="icon" href="brand/icon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
  <link rel="preload" href="fonts/geist.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/geist-mono.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body data-mood="calme" data-view="home">

  <!-- ================= Fond : lueurs, braises, grain ================= -->
  <div class="backdrop" aria-hidden="true">
    <div class="bd-glow bd-a"></div><div class="bd-glow bd-b"></div><div class="bd-glow bd-c"></div>
    <div class="bd-mark"></div>
    <canvas class="bd-embers" id="embers"></canvas>
    <div class="bd-vignette"></div>
    <div class="bd-grain"></div>
  </div>

  <!-- ================= Mode démo (?demo) ================= -->
  <div class="demo-bar" id="demo-bar" hidden></div>

  <!-- ================= Bandeau de données ================= -->
  <div class="ticker" aria-hidden="true"><div class="ticker-track" id="ticker"></div></div>

  <!-- ================= Barre de navigation ================= -->
  <header class="nav">
    <a class="brand" href="#/" aria-label="WICK">
      <img class="brand-logo" src="brand/icon-192.png" alt="">
      <img class="brand-word" src="brand/wordmark.png" alt="WICK">
      <span class="brand-tag">v1.2</span>
    </a>
    <nav class="tabs" aria-label="Sections">
      <a href="#/" data-tab="home" data-i18n="tabHome">My candle</a>
      <a href="#/quests" data-tab="quests"><span data-i18n="tabQuests">Quests</span><i class="tab-dot" hidden></i></a>
      <a href="#/leaderboard" data-tab="top" data-i18n="tabTop">Leaderboard</a>
      <a href="#/coin" data-tab="coin"><span data-i18n="tabCoin">The coin</span> <b class="tab-ticker">$WICK</b></a>
      <a href="#/how" data-tab="how" data-i18n="tabHow">How it works</a>
    </nav>
    <div class="nav-right">
      <span class="status" id="status"><i></i><span id="status-text">live</span></span>
      <a class="icon-btn" id="x-link" target="_blank" rel="noopener" aria-label="X" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.8 3h3.1l-6.8 7.8L22 21h-6.2l-4.9-6.4L5.3 21H2.2l7.3-8.3L2 3h6.4l4.4 5.8L17.8 3zm-1.1 16.2h1.7L7.4 4.7H5.6l11.1 14.5z"/></svg>
      </a>
      <a class="icon-btn" id="tg-link" target="_blank" rel="noopener" aria-label="Telegram" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.9 4.3 18.7 19.5c-.2 1-.9 1.3-1.7.8l-4.7-3.5-2.3 2.2c-.3.3-.5.5-1 .5l.3-4.8 8.8-7.9c.4-.3-.1-.5-.6-.2L6.6 13.4 2 12c-1-.3-1-1 .2-1.5L20.5 3.4c.8-.3 1.6.2 1.4.9z"/></svg>
      </a>
      <button class="pill-btn" id="me-btn" hidden><span class="me-dot"></span><span id="me-btn-name"></span></button>
      <a class="cta soon" id="buy-btn" target="_blank" rel="noopener"><span data-i18n="soon">Soon on pump.fun</span></a>
    </div>
  </header>

  <main>
    <!-- ================= Ma bougie (et la page de profil d'une bougie) ================= -->
    <section class="view" data-view="home">
      <header class="profile" id="profile" hidden></header>

      <div class="intro" id="intro">
        <div class="intro-text">
          <p class="eyebrow"><i class="pulse-dot"></i><span id="intro-eyebrow"></span></p>
          <h1 id="intro-title">Adopt your <span class="grad">candle.</span></h1>
          <p class="lead" id="intro-lead"></p>
          <a class="quest-nudge" id="quest-nudge" href="#/quests" hidden></a>
        </div>
        <dl class="kpis" id="kpis"></dl>
      </div>

      <div class="hero">
        <div class="stage-card">
          <div class="stage" id="stage"></div>
          <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>

          <div class="hud hud-top">
            <div class="hud-id">
              <span class="mono-label" id="hud-id"></span>
              <strong id="hud-name">—</strong>
              <span class="hud-sub" id="hud-sub"></span>
            </div>
            <div class="hud-chips">
              <span class="chip" id="mood-chip"></span>
              <span class="chip" id="market-chip"></span>
              <span class="chip chip-boost" id="boost-chip" hidden></span>
            </div>
          </div>

          <div class="bubble" id="bubble" aria-live="polite">
            <span id="bubble-text">…</span>
            <small id="bubble-tag" hidden></small>
          </div>

          <div class="hud hud-bottom">
            <div class="actions" id="actions"></div>
          </div>
        </div>

        <aside class="side">
          <section class="panel me-card" id="vitals"></section>
          <section class="panel" id="evolution"></section>
        </aside>
      </div>

      <section class="panel story" id="story" hidden></section>

      <div class="world" id="world">
        <h2 class="section-title" data-i18n="worldTitle">The world right now</h2>
        <div class="world-grid">
          <section class="panel" id="podium"></section>
          <section class="panel feed-card">
            <header class="panel-head"><span class="panel-title" id="feed-title"><span data-i18n="feedTitle">Live log</span></span><span class="live"><i></i>live</span></header>
            <ol class="feed" id="feed"></ol>
          </section>
          <section class="panel" id="reward" hidden></section>
        </div>
      </div>
    </section>

    <!-- ================= Quêtes ================= -->
    <section class="view" data-view="quests" hidden>
      <div class="page" id="quests-page"></div>
    </section>

    <!-- ================= Classement ================= -->
    <section class="view" data-view="top" hidden>
      <div class="page" id="top-page"></div>
    </section>

    <!-- ================= Le coin ================= -->
    <section class="view" data-view="coin" hidden>
      <div class="page" id="coin-page"></div>
    </section>

    <!-- ================= How it works ================= -->
    <section class="view" data-view="how" hidden>
      <div class="page" id="how-page"></div>
    </section>
  </main>

  <footer class="foot">
    <div class="foot-inner">
      <div class="foot-brand">
        <img class="brand-word" src="brand/wordmark.png" alt="WICK">
        <p data-i18n="disclaimer"></p>
      </div>
      <nav class="foot-links">
        <a href="#/" data-i18n="tabHome">My candle</a>
        <a href="#/quests" data-i18n="tabQuests">Quests</a>
        <a href="#/leaderboard" data-i18n="tabTop">Leaderboard</a>
        <a href="#/coin">$WICK</a>
        <a href="#/how" data-i18n="tabHow">How it works</a>
      </nav>
      <!-- Discret : le compte X officiel et le code source -->
      <div class="foot-social">
        <a href="https://x.com/trywickdotfun" target="_blank" rel="noopener" aria-label="WICK on X" title="@trywickdotfun">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.8 3h3.1l-6.8 7.8L22 21h-6.2l-4.9-6.4L5.3 21H2.2l7.3-8.3L2 3h6.4l4.4 5.8L17.8 3zm-1.1 16.2h1.7L7.4 4.7H5.6l11.1 14.5z"/></svg>
        </a>
        <a href="https://github.com/wickdotfun/trywick" target="_blank" rel="noopener" aria-label="WICK on GitHub" title="Source code">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.1-1.46-1.1-1.46-.9-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.9 1.52 2.34 1.08 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02a9.56 9.56 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.69-4.57 4.93.36.31.68.92.68 1.85v2.75c0 .27.18.58.69.48A10 10 0 0 0 12 2z"/></svg>
        </a>
      </div>
      <p class="foot-meta mono" id="foot-meta"></p>
    </div>
  </footer>

  <!-- Barre d'onglets en bas, sur téléphone -->
  <nav class="tabbar" aria-label="Sections" id="tabbar">
    <a href="#/" data-tab="home" data-ico="flame"><span data-i18n="tabHome">My candle</span></a>
    <a href="#/quests" data-tab="quests" data-ico="quest"><span data-i18n="tabQuests">Quests</span><i class="tab-dot" hidden></i></a>
    <a href="#/leaderboard" data-tab="top" data-ico="trophy"><span>Top</span></a>
    <a href="#/coin" data-tab="coin" data-ico="chart"><span>$WICK</span></a>
    <a href="#/how" data-tab="how" data-ico="info"><span data-i18n="tabHowShort">Info</span></a>
  </nav>

  <!-- Fenêtre : bienvenue, phrase, récupération, photo -->
  <dialog class="modal" id="modal">
    <form method="dialog" class="modal-close"><button aria-label="Close">✕</button></form>
    <div id="modal-body"></div>
  </dialog>

  <div class="toast" id="toast" role="status" hidden></div>

  <script type="module" src="build/app.js"></script>
</body>
</html>
