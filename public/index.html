<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WICK — strike a match</title>
  <meta name="description" content="One giant candle. Every coin launched here is a match that orbits it and makes it melt. Strike yours.">
  <meta property="og:title" content="WICK — strike a match">
  <meta property="og:description" content="One giant candle. Every coin launched is a match that makes it melt.">
  <meta property="og:image" content="/brand/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="/brand/og.png">
  <meta name="theme-color" content="#080504">
  <link rel="icon" href="brand/icon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
  <link rel="preload" href="fonts/geist.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/geist-mono.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- La bougie (3D) -->
  <div class="stage" id="stage" aria-label="The candle and its matches"></div>
  <div class="css-candle" id="css-candle" aria-hidden="true"><i></i></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="labels" id="labels" aria-hidden="true"></div>

  <div class="demo-bar" id="demo-bar" hidden></div>

  <header class="top">
    <a class="brand" href="/" aria-label="WICK">
      <img class="brand-logo" src="brand/icon-192.png" alt="">
      <img class="brand-word" src="brand/wordmark.png" alt="WICK">
    </a>
    <nav class="top-right">
      <span class="status" id="status" title="Live"><i></i>live</span>
      <button class="ghost" id="how-btn">How it works</button>
      <a class="ghost tick" id="wick-btn" target="_blank" rel="noopener" hidden>$WICK</a>
      <a class="icon-btn" id="x-link" href="https://x.com/trywickdotfun" target="_blank" rel="noopener" aria-label="WICK on X">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.8 3h3.1l-6.8 7.8L22 21h-6.2l-4.9-6.4L5.3 21H2.2l7.3-8.3L2 3h6.4l4.4 5.8L17.8 3zm-1.1 16.2h1.7L7.4 4.7H5.6l11.1 14.5z"/></svg>
      </a>
      <a class="icon-btn" href="https://github.com/wickdotfun/trywick" target="_blank" rel="noopener" aria-label="Source code">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.1-1.46-1.1-1.46-.9-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.9 1.52 2.34 1.08 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02a9.56 9.56 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.69-4.57 4.93.36.31.68.92.68 1.85v2.75c0 .27.18.58.69.48A10 10 0 0 0 12 2z"/></svg>
      </a>
    </nav>
  </header>

  <!-- Où en est la bougie -->
  <section class="meter" aria-live="polite">
    <p class="eyebrow">Candle <b id="candle-no">#1</b></p>
    <p class="count"><strong id="count">0</strong><span>/ <span id="per">1,000</span> matches</span></p>
    <div class="bar"><i id="bar"></i></div>
    <p class="meter-sub" id="meter-sub">&nbsp;</p>
  </section>

  <!-- Le fil des allumettes -->
  <aside class="feed" id="feed-panel">
    <header class="feed-head">
      <span>Latest matches</span>
      <span class="live"><i></i>live</span>
    </header>
    <ol class="feed-list" id="feed"></ol>
    <section class="finals" id="finals" hidden>
      <h3>Final matches</h3>
      <ol id="finals-list"></ol>
    </section>
  </aside>
  <button class="feed-toggle" id="feed-toggle" aria-label="Latest matches">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
  </button>

  <!-- Frapper une allumette -->
  <div class="cta-wrap">
    <button class="cta" id="strike-btn">
      <svg class="match-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 15.5 8.5"/><circle cx="17" cy="7" r="2.6"/></svg>
      Strike a match
    </button>
    <p class="cta-sub">Launch your coin on pump.fun · it joins the orbit</p>
  </div>

  <div class="tip" id="tip" hidden></div>

  <dialog class="modal" id="modal">
    <form method="dialog" class="modal-close"><button aria-label="Close">✕</button></form>
    <div id="modal-body"></div>
  </dialog>

  <div class="toasts" id="toasts" role="status"></div>

  <script type="module" src="build/app.js"></script>
</body>
</html>
